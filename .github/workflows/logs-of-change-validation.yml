name: Logs of Change validation
on:
  pull_request:
  push:
    branches: [development, testing, main, architecture/serverless-product-foundation]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            serverless/package-lock.json
            web/package-lock.json
      - run: npm ci --prefix serverless
      - run: npm ci --prefix web
      - run: npm --prefix web test -- --watch=false
      - run: npm --prefix web run build
      - run: node serverless/scripts/package-backend.mjs
      - run: node serverless/scripts/package-web.mjs
      - run: node --test serverless/test/*.test.mjs
      - run: python -m pip install cfn-lint==1.60.1
      - run: cfn-lint -r us-east-1 -t serverless/template.yaml serverless/services/identity/template.yaml serverless/services/releases/template.yaml serverless/services/evidence/template.yaml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: logs-of-change-lambda-packages
          include-hidden-files: true
          path: serverless/.build/
          if-no-files-found: error
          retention-days: 14
