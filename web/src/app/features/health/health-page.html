<main class="workspace" aria-labelledby="product-name">
  <header class="product">
    <h1 id="product-name">Logs of Change</h1>
    <p>Revisión y aprobación de entregas de software.</p>
  </header>

  <section class="status-panel" aria-labelledby="status-heading">
    <h2 id="status-heading">Conexión con la API</h2>

    <div class="status" role="status">
      @switch (store.status()) {
        @case ('checking') {
          <span class="status-dot" aria-hidden="true"></span>
          <span>Verificando conexión…</span>
        }
        @case ('connected') {
          <span class="status-dot connected" aria-hidden="true"></span>
          <span>API disponible</span>
        }
        @case ('unavailable') {
          <span class="status-dot unavailable" aria-hidden="true"></span>
          <span>La API no respondió con el estado esperado.</span>
        }
      }
    </div>

    <button type="button" (click)="store.check()" [disabled]="store.status() === 'checking'">
      Verificar conexión
    </button>
  </section>
</main>
